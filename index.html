<script>
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('canvas'),ctx=canvas.getContext('2d');
let W=canvas.width,H=canvas.height;
const layers=[], names={frame:'框',image:'图片',text:'文字'};
const fontData=JSON.parse($('fonts').textContent);
const fonts=[['system','系统字体'],...fontData.map(font=>[font.family,font.label])];
const loadedFonts=new Map();
const pendingFonts=new Set();
const background={color:'#ffffff',image:null,fit:'cover'};
let chosen=null,nextId=1,gesture,uploadTarget;
const active=()=>layers.find(layer=>layer.id===chosen);
const find=id=>layers.find(layer=>layer.id===id);
const notify=text=>$('status').textContent=text;
const limit=(n,min,max)=>Math.max(min,Math.min(max,n));
const children=id=>layers.filter(layer=>layer.parent===id);
function descendants(id){return children(id).flatMap(layer=>[layer,...descendants(layer.id)])}
function title(layer){return layer.name.trim()||names[layer.type]}
function add(type,image){
 const w=type==='frame'?560:480,h=type==='frame'?350:type==='text'?130:360;
 const shift=(layers.length%6)*35;
 const layer={id:nextId++,type,name:'',x:Math.round((W-w)/2+shift),y:Math.round((H-h)/2+shift),w,h,parent:null,hidden:false,locked:false,fill:type==='frame'?'#e9f1fc':'#193e71',radius:36,image,fit:'cover',text:'',font:'system',size:72,bold:false,align:'left'};
 layers.push(layer);select(layer.id);
 if(type==='text')$('properties').querySelector('textarea').focus();
 return layer;
}
function visible(layer){return !layer.hidden&&(!layer.parent||visible(find(layer.parent)))}
function locked(layer){return layer.locked||Boolean(layer.parent&&locked(find(layer.parent)))}
function imageBox(img,x,y,w,h,fit){
 const factor=(fit==='contain'?Math.min:Math.max)(w/img.width,h/img.height);
 const iw=fit==='stretch'?w:img.width*factor,ih=fit==='stretch'?h:img.height*factor;
 ctx.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih);
}
function drawLayer(layer){
 if(!visible(layer))return;
 const {x,y,w,h}=layer;
 ctx.save();
 if(layer.type==='frame'){
  ctx.fillStyle=layer.fill;ctx.beginPath();ctx.roundRect(x,y,w,h,Math.min(layer.radius,w/2,h/2));ctx.fill();
 }else if(layer.type==='image'){
  ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();imageBox(layer.image,x,y,w,h,layer.fit);
 }else{
  ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  ctx.fillStyle=layer.fill;ctx.font=(layer.bold?'700 ':'400 ')+layer.size+'px '+(layer.font==='system'?'system-ui':layer.font)+',system-ui,sans-serif';
  ctx.textAlign=layer.align;ctx.textBaseline='top';
  const tx=x+({left:0,center:w/2,right:w}[layer.align]);
  for(const [i,line] of layer.text.split('\n').entries())ctx.fillText(line,tx,y+i*layer.size*1.23);
 }
 ctx.restore();
 for(const child of children(layer.id))drawLayer(child);
}
function render(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle=background.color;ctx.fillRect(0,0,W,H);
 if(background.image)imageBox(background.image,0,0,W,H,background.fit);
 for(const layer of layers)if(!layer.parent)drawLayer(layer);
 const layer=active(),outline=$('outline');
 outline.hidden=!layer||!visible(layer);
 if(!outline.hidden)Object.assign(outline.style,{left:layer.x/W*100+'%',top:layer.y/H*100+'%',width:layer.w/W*100+'%',height:layer.h/H*100+'%'});
}
function select(id){chosen=id;list();properties();render()}
function action(label,fn){
 const button=document.createElement('button');button.type='button';button.textContent=label;button.onclick=fn;return button;
}
function list(){
 const root=$('layers');root.replaceChildren();
 function walk(parent,depth){
  for(const layer of children(parent).reverse()){
   const row=document.createElement('div');row.className='layer';row.style.marginLeft=depth*12+'px';
   const pick=action(title(layer),()=>select(layer.id));pick.setAttribute('aria-pressed',String(chosen===layer.id));pick.title=title(layer);
   const hide=action(layer.hidden?'显示':'隐藏',()=>{layer.hidden=!layer.hidden;list();render()});
   const lock=action(layer.locked?'解锁':'锁定',()=>{layer.locked=!layer.locked;list();properties();render()});
   row.append(pick,hide,lock);root.append(row);walk(layer.id,depth+1);
  }
 }
 walk(null,0);
 if(!layers.length){const note=document.createElement('small');note.textContent='画布为空。添加框、图片或文字开始。';root.append(note)}
 $('layerActions').hidden=!active();
}
function field(parent,label,tag,value,change,setup={}){
 const box=document.createElement('label');box.textContent=label;
 const input=document.createElement(tag);
 if(tag==='select')for(const [id,label] of setup.options)input.add(new Option(label,id));
 else Object.assign(input,setup);
 if(input.type==='checkbox')input.checked=value;else input.value=value;
 input.addEventListener(tag==='select'||input.type==='number'||input.type==='checkbox'?'change':'input',()=>change(input.type==='checkbox'?input.checked:input.value,input));
 box.append(input);parent.append(box);return input;
}
const fits=[['cover','等比填充'],['contain','等比完整显示'],['stretch','按宽高拉伸']];
let geometryInputs={};
function properties(){
 const root=$('properties'),layer=active();root.replaceChildren();
 $('propertiesTitle').textContent=layer?'图层属性':'画布设置';
 $('showCanvas').hidden=!layer;
 if(!layer){
  const sizeGrid=document.createElement('div');sizeGrid.className='grid';root.append(sizeGrid);
  for(const [axis,label] of [['width','画布宽度（px）'],['height','画布高度（px）']]){
   field(sizeGrid,label,'input',canvas[axis],(v,input)=>{
    if(v!==''&&Number.isFinite(Number(v)))resizeCanvas(axis,Number(v));
    input.value=canvas[axis];
   },{type:'number',min:64,max:4096,step:1});
  }
  field(root,'底色','input',background.color,v=>{background.color=v;render()},{type:'color'});
  root.append(action('上传背景图',()=>requestImage('background')));
  if(background.image){
   field(root,'背景适配','select',background.fit,v=>{background.fit=v;render()},{options:fits});
   root.append(action('移除背景图',()=>{background.image=null;properties();render()}));
  }
  return;
 }
 const disabled=locked(layer);
 field(root,'图层名称','input',layer.name,v=>{layer.name=v;list()},{placeholder:'可留空',maxLength:40});
 const grid=document.createElement('div');grid.className='grid';root.append(grid);
 geometryInputs={};
 for(const [key,label] of [['x','水平位置'],['y','垂直位置'],['w','宽度'],['h','高度']]){
  geometryInputs[key]=field(grid,label,'input',layer[key],v=>{if(v!=='')setRect(layer,{...layer,[key]:Number(v)});syncGeometry()},{type:'number',step:1,disabled});
 }
 const blocked=new Set([layer.id,...descendants(layer.id).map(item=>item.id)]);
 const frames=layers.filter(item=>item.type==='frame'&&!blocked.has(item.id)&&!locked(item));
 field(root,'所属框','select',String(layer.parent||''),v=>{layer.parent=Number(v)||null;list();render()},{options:[['','画布'],...frames.map(item=>[String(item.id),title(item)])]});
 if(layer.type==='frame'){
  field(root,'填充颜色','input',layer.fill,v=>{layer.fill=v;render()},{type:'color',disabled});
  field(root,'圆角','input',layer.radius,v=>{if(v!==''){layer.radius=limit(Number(v),0,500);render()}},{type:'number',min:0,max:500,disabled});
 }
 if(layer.type==='image'){
  const replace=action('替换图片',()=>requestImage(layer.id));replace.disabled=disabled;root.append(replace);
  field(root,'图片适配','select',layer.fit,v=>{layer.fit=v;render()},{options:fits}).disabled=disabled;
 }
 if(layer.type==='text'){
  field(root,'文字内容','textarea',layer.text,v=>{layer.text=v;render()},{placeholder:'输入文字',disabled});
  const fontSelect=field(root,'字体','select',layer.font,v=>{
   const task=applyFont(layer,v,fontSelect);
   pendingFonts.add(task);
   void task.finally(()=>pendingFonts.delete(task));
  },{options:fonts});
  fontSelect.setAttribute('data-font-select','');fontSelect.disabled=disabled;
  const importFont=action('导入本机字体',()=>{
   $('fontUpload').value='';
   $('fontUpload').click();
  });
  importFont.disabled=disabled;root.append(importFont);
  field(grid,'字号','input',layer.size,v=>{if(v!==''){layer.size=limit(Number(v),6,500);render()}},{type:'number',min:6,max:500,disabled});
  field(grid,'文字颜色','input',layer.fill,v=>{layer.fill=v;render()},{type:'color',disabled});
  field(root,'对齐','select',layer.align,v=>{layer.align=v;render()},{options:[['left','左对齐'],['center','居中'],['right','右对齐']]}).disabled=disabled;
  field(root,'粗体','input',layer.bold,v=>{layer.bold=v;render()},{type:'checkbox',disabled});
 }
 root.append(action('编辑画布背景',()=>select(null)));
}
function resizeCanvas(axis,value){
 const pixels=Math.round(limit(value,64,4096));
 if(axis==='width')W=pixels;else H=pixels;
 canvas[axis]=pixels;
 $('canvasSize').textContent=W+' × '+H;
 canvas.parentElement.style.setProperty('--preview-width', 70*W/H+'vh');
 render();
}
$('showCanvas').onclick=()=>select(null);
function syncGeometry(){const layer=active();if(layer)for(const [key,input] of Object.entries(geometryInputs))input.value=layer[key]}
function setRect(layer,box,moveGroup=true){
 const x=Math.round(limit(box.x,-W,W)),y=Math.round(limit(box.y,-H,H));
 const dx=x-layer.x,dy=y-layer.y;
 Object.assign(layer,{x,y,w:Math.round(limit(box.w,12,W*2)),h:Math.round(limit(box.h,12,H*2))});
 if(moveGroup&&(dx||dy))for(const child of descendants(layer.id)){child.x+=dx;child.y+=dy}
 render();
}
const handles=[['nw',0,0],['n',50,0],['ne',100,0],['e',100,50],['se',100,100],['s',50,100],['sw',0,100],['w',0,50]];
for(const [,x,y] of handles){
 const marker=document.createElement('span');marker.className='grip';marker.style.left=x+'%';marker.style.top=y+'%';$('outline').append(marker);
}
function point(event){const r=canvas.getBoundingClientRect();return {x:(event.clientX-r.left)*W/r.width,y:(event.clientY-r.top)*H/r.height,tolerance:8*W/r.width}}
function hit(layer,x,y){return x>=layer.x&&x<=layer.x+layer.w&&y>=layer.y&&y<=layer.y+layer.h}
function painted(parent){return children(parent).flatMap(layer=>[layer,...painted(layer.id)])}
canvas.onpointerdown=event=>{
 if(event.button!==0)return;
 const p=point(event),current=active();
 let edge;
 if(current&&visible(current)&&!locked(current)){
  edge=handles.find(([,x,y])=>Math.abs(p.x-current.x-current.w*x/100)<=p.tolerance&&Math.abs(p.y-current.y-current.h*y/100)<=p.tolerance)?.[0];
 }
 const target=edge?current:painted(null).reverse().find(layer=>visible(layer)&&hit(layer,p.x,p.y));
 select(target?.id??null);
 canvas.focus({preventScroll:true});
 if(!target||locked(target))return;
 gesture={target,edge,start:{...target},p,id:event.pointerId};
 canvas.setPointerCapture(event.pointerId);
};
canvas.onpointermove=event=>{
 if(!gesture||gesture.id!==event.pointerId)return;
 const {target,edge,start,p}=gesture,q=point(event),dx=q.x-p.x,dy=q.y-p.y,box={...start};
 if(!edge){box.x+=dx;box.y+=dy}
 else{
  if(edge.includes('e'))box.w+=dx;
  if(edge.includes('s'))box.h+=dy;
  if(edge.includes('w')){box.w=Math.max(12,start.w-dx);box.x=start.x+start.w-box.w}
  if(edge.includes('n')){box.h=Math.max(12,start.h-dy);box.y=start.y+start.h-box.h}
 }
 setRect(target,box,!edge);syncGeometry();
};
canvas.onpointerup=canvas.onpointercancel=canvas.onlostpointercapture=()=>{gesture=null};
function requestImage(target){uploadTarget=target;$('upload').value='';$('upload').click()}
$('upload').onchange=async()=>{
 const file=$('upload').files[0],target=uploadTarget;
 if(!file)return;
 const url=URL.createObjectURL(file);
 try{
  const img=new Image();img.src=url;await img.decode();
  if(target==='background'){background.image=img;select(null)}
  else if(target==='new')add('image',img);
  else if(find(target)){find(target).image=img;select(target)}
  notify('');
 }catch{notify('无法打开图片，请试试 PNG、JPEG 或 WebP。')}
 finally{URL.revokeObjectURL(url)}
};
$('addFrame').onclick=()=>add('frame');
$('addImage').onclick=()=>requestImage('new');
$('addText').onclick=()=>add('text');
function deleteSelected(){
 const layer=active();if(!layer||locked(layer))return false;
 for(const child of children(layer.id))child.parent=layer.parent;
 layers.splice(layers.indexOf(layer),1);select(null);
 return true;
}
$('remove').onclick=deleteSelected;
document.addEventListener('keydown',event=>{
 if(!['Delete','Backspace'].includes(event.key)||event.isComposing||event.ctrlKey||event.metaKey||event.altKey)return;
 if(event.target.closest?.('input,textarea,select,[contenteditable],[role="textbox"]'))return;
 if(deleteSelected())event.preventDefault();
});
$('copy').onclick=()=>{
 const layer=active();if(!layer)return;
 function duplicate(source,parent){
  const copy={...source,id:nextId++,x:source.x+24,y:source.y+24,parent,locked:false};
  layers.push(copy);
  for(const child of children(source.id))duplicate(child,copy.id);
  return copy;
 }
 select(duplicate(layer,layer.parent).id);
};
function reorder(direction){
 const layer=active();if(!layer||locked(layer))return;
 const siblings=children(layer.parent),neighbor=siblings[siblings.indexOf(layer)+direction];
 if(!neighbor)return;
 const a=layers.indexOf(layer),b=layers.indexOf(neighbor);
 [layers[a],layers[b]]=[layers[b],layers[a]];list();render();
}
$('up').onclick=()=>reorder(1);$('down').onclick=()=>reorder(-1);
$('save').onclick=async()=>{
 await Promise.all(pendingFonts);render();
 canvas.toBlob(blob=>{
  if(!blob){notify('导出失败，请重试。');return}
  const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='WiFurLab CREA-名片.png';link.click();
  setTimeout(()=>URL.revokeObjectURL(link.href),1000);
 },'image/png');
};
$('licenses').textContent=fontData.map(font=>font.label+'\n'+font.license).join('\n\n');
let nextFont=1;
$('fontUpload').onchange=async()=>{
 const file=$('fontUpload').files[0],layer=active();
 if(!file)return;
 const family='WiFurLocal'+nextFont++;
 const label=file.name.replace(/\.[^.]+$/,'');
 try{
  const face=new FontFace(family,await file.arrayBuffer());
  await face.load();document.fonts.add(face);
  fonts.push([family,label+'（本机）']);
  if(layer?.type==='text'&&find(layer.id)&&!locked(layer))layer.font=family;
  properties();render();notify('字体已导入，仅在当前页面使用。');
 }catch{notify('字体无法读取，请选择 TTF、OTF、WOFF 或 WOFF2。')}
};
async function applyFont(layer,family,control){
 const font=fontData.find(entry=>entry.family===family);
 try{
  if(font){
   if(!loadedFonts.has(family)){
    const face=new FontFace(family,'url('+font.src+')',font.weight?{weight:font.weight}:{});
    loadedFonts.set(family,face.load().then(loaded=>{document.fonts.add(loaded)}));
   }
   await loadedFonts.get(family);
  }
  if(control.value===family&&find(layer.id)&&!locked(layer)){
   layer.font=family;
   if(active()===layer&&!control.isConnected)properties();
   render();
  }
 }catch{
  loadedFonts.delete(family);
  if(control.value===family)control.value=layer.font;
  notify('字体加载失败，请重试。');
 }
}
select(null);
</script>
